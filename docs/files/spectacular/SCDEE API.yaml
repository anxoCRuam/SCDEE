  /api/v1/instances/{instance_pk}/:
    get:
      operationId: api_v1_instances_retrieve
      description: |+
        **Return an exam instance with role-dependent detail level.**

        - **Staff / superadmins** → full response (``InstanceResponseSerializer``) including all metadata, page count, and scores.
        - **Teachers / coordinators** → same full response, provided they have ``can_view_all_instances`` or are assigned to this instance as correctors.
        - **Students** → see their own instance only. The response uses ``StudentInstanceSerializer`` and the *content* varies with the exam's review window and ``student_permissions``:
          - **No active / upcoming / expired review** → basic fields + total_score.
          - **Review is OPEN and instance is IN_REVIEW** → detailed view (pages, annotations, rubric, grades) for every permission enabled in ``student_permissions``.
          - **Review CLOSED / COMPLETED with ``can_view_pages_after_review=True``** → same detailed view (but review requests are no longer accepted).

      summary: Instance detail (RF-7.3) – response shape depends on user role and
        review window
      parameters:
      - in: path
        name: instance_pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Instances
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResponse'
              examples:
                ManagerInstanceFull:
                  value:
                    id: 11111111-2222-3333-4444-555555555555
                    exam_id: exam-uuid
                    student_id: student-uuid
                    student_email: maria.garcia@uam.es
                    model_id: model-uuid
                    model_label: A
                    status: GRADED
                    has_issues: false
                    issue_types: []
                    total_score: '8.50'
                    expected_pages: 2
                    page_ids:
                    - aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
                    - ffffffff-gggg-hhhh-iiii-jjjjjjjjjjjj
                    created_at: '2026-05-01T09:00:00Z'
                    updated_at: '2026-05-01T12:00:00Z'
                  summary: Manager view – identical to teacher view
                  description: Managers receive the same full response as teachers.
                    The difference is that managers always pass permission checks,
                    whereas teachers may be restricted by `can_view_all_instances`
                    and `AssignmentRule` rules.
                StudentInstanceBasic:
                  value:
                    id: a1b2c3d4-...
                    exam_name: Parcial 1
                    subject_name: Álgebra
                    status: PUBLISHED
                    total_score: '8.50'
                  summary: Student view – published, no active review window
                  description: Returned when the student's instance is published but
                    there is no review window, or the window is not yet open / already
                    closed without `can_view_pages_after_review`. Only basic fields
                    and the total score are included.
                StudentInstanceDetailed:
                  value:
                    id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    exam_name: Parcial 1
                    subject_name: Álgebra
                    status: IN_REVIEW
                    total_score: '8.50'
                    pages:
                    - id: pg-uuid-1
                      instance_id: inst-uuid
                      page_number: 1
                      storage_ref: org/exams/.../page1.png
                      status: RECOGNIZED
                      issue_type: ''
                      recognized_at: '2026-05-01T10:00:00Z'
                    rubric:
                    - problem_name: Problema 1
                      max_score: '10.00'
                      criteria:
                      - description: Correct algorithm
                        score: '7.00'
                      - description: Clean code
                        score: '3.00'
                    grades:
                    - problem_name: Problema 1
                      score: '8.50'
                      rubric_selections:
                      - rc1-uuid
                    can_download: false
                  summary: Student view – during review window with all permissions
                    active
                  description: Returned when the instance is `IN_REVIEW`, the review
                    window is `OPEN`, and the exam's `student_permissions` grant access
                    to pages, annotations, rubric, and grade breakdown. `can_download`
                    reflects whether the student is allowed to download the composed
                    PDF.
                StudentInstanceAfterReview:
                  value:
                    id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    exam_name: Parcial 1
                    subject_name: Álgebra
                    status: FINALIZED
                    total_score: '8.50'
                    pages:
                    - id: pg-uuid-1
                      instance_id: inst-uuid
