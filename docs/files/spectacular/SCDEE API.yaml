  /api/v1/instances/{instance_pk}/problems/{problem_pk}/grade/:
    put:
      operationId: instances_problems_grade_manual
      description: |-
        **Assign or update the numeric grade of one problem on one instance.**

        Implements optimistic concurrency: the request must include the instance ``old_score`` the corrector last saw. If a *different* corrector touched the instance in between, the call is rejected with HTTP **409 ``CONFLICT``** and the caller is expected to re-read the instance, reconcile, and retry.

        **Process**

        1. Resolve the instance and problem; reject with ``404`` if either is missing in the caller's organisation.
        2. Compare ``old_score`` against the stored value. Mismatch → ``409`` (no write).
        3. Persist the new ``score`` (decimal, may be negative — see RF-11.1).
        4. Append a ``GRADE_UPDATED`` row to the audit log with old and new values (RF-16.1).

        **Output**

        The persisted grade.
      summary: 'Manual grade with optimistic concurrency (RF-11.1) '
      parameters:
      - in: path
        name: instance_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: problem_pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Grading
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualGradeRequest'
            examples:
              ManualGradeRequest:
                value:
                  score: '8.50'
                  old_score: '7.00'
                summary: Set a problem score with optimistic concurrency
                description: '``old_version`` is the instance score the corrector
                  last saw. The service compares it against the stored value and rejects
                  the update with HTTP 409 ``CONFLICT`` if another corrector touched
                  the instance in between.'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ManualGradeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ManualGradeRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeResponse'
              examples:
                ManualGradeSuccess:
                  value:
                    problem_id: 99999999-8888-7777-6666-555555555555
                    problem_name: P1
                    score: '8.50'
                    graded_email: teacher@a.com
                    rubric_selections: []
                  summary: Updated grade + new instance version
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse409_CONFLICT'
              examples:
                CONFLICT:
                  value:
                    error_code: CONFLICT
                  summary: CONFLICT
          description:
          - The instance was modified by another corrector since the client read it.
            The user must be explicitly authorized by an AssignmentRule
        '401':
          description: Authentication credentials missing, expired or revoked.
          content:
            application/json:
              schema:
