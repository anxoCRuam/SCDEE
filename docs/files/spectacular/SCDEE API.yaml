  /api/v1/recognition/ingest/:
    post:
      operationId: recognition_manual_ingest
      description: |-
        **Upload a file (PDF or image) into the recognition pipeline.**

        Multi-page PDFs are split and each page is stored as a separate ``ExamPage``. Recognition tasks are enqueued asynchronously, but the response includes the list of created page IDs immediately.

        **Process**

        1. Validate the multipart payload (``file`` is required).
        2. Convert to PNG pages (splitting PDFs if needed).
        3. Upload each page to MinIO and create an ``ExamPage`` row.
        4. Enqueue a ``recognize_page_task`` for each page.
        5. Return the list of created pages and their storage references.

        **Output**

        ``202 Accepted`` with details about every page created.
      summary: Manually ingest pages (PDF or image) (RF-9.2)
      tags:
      - Ingestion
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ManualIngestRequestRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualIngestResponse'
              examples:
                ManualIngestQueued:
                  value:
                    task_id: f1c92b5e-31a8-4ec5-a7e1-7b9b03f5e7e2
                    filename: exam_a_model_1.pdf
                    total_pages: 3
                    pages:
                    - page_id: b2a1c0d9-e8f7-6543-2109-87654321abcd
                      storage_ref: pending/ingestion/20260507..._p1.png
                      page_index: 1
                      status: queued
                    - page_id: c3b2d1e0-f9a8-7654-3210-98765432bcde
                      storage_ref: pending/ingestion/20260507..._p2.png
                      page_index: 2
                      status: queued
                    status: queued
                  summary: Pages created, recognition tasks queued
                  description: The endpoint returns immediately with details about
                    every page created from the uploaded file. Recognition tasks run
                    asynchronously.
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse400_NO_FILE_PROVIDED'
