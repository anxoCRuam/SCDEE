  /api/v1/auth/logout/:
    post:
      operationId: auth_logout
      description: |-
        **Invalidate a refresh token (idempotent).**

        Adds the token's ``jti`` to the Redis blacklist with a TTL matching the token's remaining lifetime. The associated access token is *not* invalidated by this call — it expires naturally within minutes.

        **Idempotency**

        Sending an already-revoked, expired or malformed refresh token still returns ``204``. This intentional behaviour lets the frontend treat logout as fire-and-forget without needing to handle ``401``.

        **Audit**

        If the request carries a valid access token, a ``LOGOUT`` row is appended to the audit log with the actor identified. Otherwise the row is anonymous (only IP).
      summary: Revoke refresh token (RF-1.4)
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
            examples:
              LogoutRequest:
                value:
                  refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                summary: Revoke a refresh token
                description: Idempotent — sending an already-revoked or expired token
                  still returns 204. The access token is not invalidated by this call
                  (it expires naturally within minutes).
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
        required: true
      security:
      - BearerAuth: []
      - {}
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                ValidationError:
                  value:
                    error_code: VALIDATION_ERROR
                    errors:
                      refresh_token:
                      - FIELD_REQUIRED
                      - BLANK
                  summary: Per-field error codes
          description: Invalid input — see ``errors`` for field-level details.
        '429':
          description: Rate limit exceeded for this endpoint.
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                properties:
                  error_code:
                    type: string
                    enum:
                    - RATE_LIMIT_EXCEEDED
                    description: Symbolic, locale-independent error identifier. Map
                      to a localised message on the frontend.
              examples:
                RATE_LIMIT_EXCEEDED:
                  summary: RATE_LIMIT_EXCEEDED
                  value:
                    error_code: RATE_LIMIT_EXCEEDED
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh
      description: |-
        **Renew the JWT pair without re-entering credentials.**

        **Process**

        1. Decode the refresh token; reject if signature, expiry or ``token_type`` is wrong.
        2. Reject if the token's ``jti`` is in the Redis blacklist or the user's token generation has advanced (logout-all).
        3. Mint a new access + refresh pair; add the *old* refresh token's ``jti`` to the blacklist so it cannot be reused.

        **Output**

        The new pair. ``user`` is intentionally ``null`` — the frontend already has user metadata from the original login response.

        **Frontend contract**

        The client MUST replace its stored refresh token immediately after a successful refresh. Storing both old and new will invalidate both at the next refresh attempt (rotation enforces single-use).
      summary: Rotate the refresh token (RF-1.3)
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
            examples:
              RefreshRequest:
                value:
                  refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                summary: Token refresh
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
              examples:
                RefreshSuccess:
                  value:
                    access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    user: null
                  summary: Rotated token pair
                  description: The previous refresh token is revoked (added to the
                    Redis blacklist) and replaced with the one returned here. The
                    frontend MUST discard the old refresh token immediately.
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                ValidationError:
                  value:
                    error_code: VALIDATION_ERROR
                    errors:
                      refresh_token:
                      - FIELD_REQUIRED
                      - BLANK
                  summary: Per-field error codes
          description: Invalid input — see ``errors`` for field-level details.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse401_INVALID_TOKEN_INVALID_TOKEN_TYPE_TOKEN_EXPIRED_TOKEN_REVOKED'
              examples:
                INVALIDTOKEN:
                  value:
                    error_code: INVALID_TOKEN
                  summary: INVALID_TOKEN
                INVALIDTOKENTYPE:
                  value:
                    error_code: INVALID_TOKEN_TYPE
                  summary: INVALID_TOKEN_TYPE
                TOKENEXPIRED:
                  value:
                    error_code: TOKEN_EXPIRED
                  summary: TOKEN_EXPIRED
                TOKENREVOKED:
                  value:
                    error_code: TOKEN_REVOKED
                  summary: TOKEN_REVOKED
          description: Refresh token cannot be honoured. ``TOKEN_REVOKED`` is returned
            both when the token was explicitly logged out and when the user's token
            generation has advanced (forced logout-all).
        '429':
          description: Rate limit exceeded for this endpoint.
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                properties:
                  error_code:
                    type: string
                    enum:
                    - RATE_LIMIT_EXCEEDED
                    description: Symbolic, locale-independent error identifier. Map
                      to a localised message on the frontend.
              examples:
                RATE_LIMIT_EXCEEDED:
                  summary: RATE_LIMIT_EXCEEDED
                  value:
                    error_code: RATE_LIMIT_EXCEEDED
