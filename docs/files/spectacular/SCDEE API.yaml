              schema:
                $ref: '#/components/schemas/ErrorResponse401_AUTHENTICATION_REQUIRED'
              examples:
                AUTHENTICATIONREQUIRED:
                  value:
                    error_code: AUTHENTICATION_REQUIRED
                  summary: AUTHENTICATION_REQUIRED
          description: Authentication credentials missing, expired or revoked.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse403_PERMISSION_DENIED'
              examples:
                PERMISSIONDENIED:
                  value:
                    error_code: PERMISSION_DENIED
                  summary: PERMISSION_DENIED
          description: You must be an organization manager to access audit logs.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse429_RATE_LIMIT_EXCEEDED'
              examples:
                RATELIMITEXCEEDED:
                  value:
                    error_code: RATE_LIMIT_EXCEEDED
                  summary: RATE_LIMIT_EXCEEDED
          description: Rate limit exceeded for this endpoint.
  /api/v1/auth/login/:
    post:
      operationId: auth_login
      description: |-
        **Authenticate against the active auth plugin and emit a JWT pair.**

        The plugin is configured by the ``AUTH_PLUGIN_CLASS`` setting. In v1.0 it is ``JWTAuthPlugin``; future versions may swap in an SSO plugin without changing this endpoint's contract (RF-1.1, RF-1.5).

        **Process**

        1. Validate the request body shape (``email`` is RFC-5322; ``password`` is non-empty).
        2. Look up the user by email; reject if missing, inactive, or the organisation is inactive.
        3. Verify the password against the stored hash (Argon2 by default — see RF-16.4).
        4. Mint an access token (``JWT_ACCESS_TOKEN_LIFETIME_MINUTES``, default 15 min) and a refresh token (``JWT_REFRESH_TOKEN_LIFETIME_DAYS``, default 7 days).
        5. Append a ``LOGIN_SUCCESS`` (or ``LOGIN_FAILURE`` on error) row to the audit log (RF-16.1).

        **Output**

        The access token's payload includes ``user_id``, ``organization_id``, ``is_superadmin`` and ``is_staff`` so the multi-tenant middleware can resolve the tenant on every subsequent request without an extra DB lookup.

        **Rate limiting**

        10 requests per minute per IP, regardless of organisation. Exceeding this returns HTTP 429.
      summary: Authenticate with email and password (RF-1.2)
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
            examples:
              LoginRequest:
                value:
                  email: professor@uam.es
                  password: S3cretP@ssw0rd!
                summary: Standard login
                description: Email + password from the institutional account.
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
              examples:
                LoginSuccess:
                  value:
                    access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    user:
                      id: 5e1f8a3a-9b7d-4e1a-9c1d-1234567890ab
                      email: professor@uam.es
                      first_name: María
                      last_name: García
                      is_staff: false
                      is_superadmin: false
                      organization_id: 11111111-2222-3333-4444-555555555555
                  summary: Token pair + user metadata
                  description: On success, the response carries the JWT pair plus
                    the basic user fields the frontend needs to skip an extra ``GET
                    /profile/`` call. The ``user.organization_id`` is what ties subsequent
                    requests to a tenant.
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                ValidationError:
                  value:
                    error_code: VALIDATION_ERROR
                    errors:
                      email:
                      - FIELD_REQUIRED
                      - INVALID
                      password:
                      - FIELD_REQUIRED
                      - BLANK
                  summary: Per-field error codes
          description: Invalid input — see ``errors`` for field-level details.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse401_INVALID_CREDENTIALS_ORG_INACTIVE_USER_INACTIVE'
              examples:
                INVALIDCREDENTIALS:
                  value:
                    error_code: INVALID_CREDENTIALS
                  summary: INVALID_CREDENTIALS
                USERINACTIVE:
                  value:
                    error_code: USER_INACTIVE
                  summary: USER_INACTIVE
                ORGINACTIVE:
                  value:
                    error_code: ORG_INACTIVE
                  summary: ORG_INACTIVE
          description: Login refused. ``INVALID_CREDENTIALS`` is also returned for
            unknown e-mails to avoid leaking which addresses are registered.
        '429':
          description: Rate limit exceeded for this endpoint.
          content:
            application/json:
              schema:
