  /api/v1/audit-logs/:
    get:
      operationId: list_audit_logs
      description: Paginated list of audit logs for the authenticated manager's organization.
        Allows filtering by event type, actor, affected entity, date range, and IP
        address.
      summary: Retrieve audit logs (RF-16.2)
      parameters:
      - in: query
        name: actor_id
        schema:
          type: string
          format: uuid
        description: Actor ID
      - in: query
        name: entity_id
        schema:
          type: string
        description: Entity ID
      - in: query
        name: entity_type
        schema:
          type: string
        description: Entity type
      - in: query
        name: event_type
        schema:
          type: string
        description: Event type (exact match)
      - in: query
        name: ip_address
        schema:
          type: string
        description: Exact IP address
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: page_size
        schema:
          type: integer
        description: Page size
      - in: query
        name: timestamp_from
        schema:
          type: string
          format: date-time
        description: From (ISO 8601)
      - in: query
        name: timestamp_to
        schema:
          type: string
          format: date-time
        description: To (ISO 8601)
      tags:
      - Audit
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
        '401':
          content:
