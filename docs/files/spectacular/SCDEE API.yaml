paths:
  /api/v1/annotations/{annotation_pk}/:
    put:
      operationId: api_v1_annotations_update
      description: Update and delete annotations (RF-10.2, RF-10.3).
      summary: Update annotation (RF-10.2) owner or OrgManager
      parameters:
      - in: path
        name: annotation_pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Annotations
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateAnnotationRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAnnotationRequest'
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationResponse'
          description: ''
        '401':
          description: Authentication credentials missing, expired or revoked.
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                properties:
                  error_code:
                    type: string
                    enum:
                    - AUTHENTICATION_REQUIRED
                    description: Symbolic, locale-independent error identifier. Map
                      to a localised message on the frontend.
              examples:
                AUTHENTICATION_REQUIRED:
                  summary: AUTHENTICATION_REQUIRED
                  value:
                    error_code: AUTHENTICATION_REQUIRED
        '403':
          description: Authenticated, but not authorised for this resource.
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                properties:
                  error_code:
                    type: string
                    enum:
                    - PERMISSION_DENIED
                    description: Symbolic, locale-independent error identifier. Map
                      to a localised message on the frontend.
              examples:
                PERMISSION_DENIED:
                  summary: PERMISSION_DENIED
                  value:
                    error_code: PERMISSION_DENIED
        '404':
          description: Resource not found in the caller's organisation.
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                properties:
                  error_code:
                    type: string
                    enum:
                    - NOT_FOUND
                    description: Symbolic, locale-independent error identifier. Map
                      to a localised message on the frontend.
              examples:
                NOT_FOUND:
                  summary: NOT_FOUND
                  value:
                    error_code: NOT_FOUND
        '400':
          description: Invalid input — see ``errors`` for field-level details.
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                - errors
                properties:
                  error_code:
                    type: string
                    enum:
                    - VALIDATION_ERROR
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                    description: Map of field name → list of symbolic error codes.
                      Nested fields are flattened with dot notation.
              examples:
                ValidationError:
                  summary: Per-field error codes
                  value:
                    error_code: VALIDATION_ERROR
                    errors:
                      <field_name>:
                      - <SYMBOLIC_CODE>
        '429':
          description: Rate limit exceeded for this endpoint.
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                properties:
                  error_code:
                    type: string
                    enum:
                    - RATE_LIMIT_EXCEEDED
                    description: Symbolic, locale-independent error identifier. Map
                      to a localised message on the frontend.
              examples:
                RATE_LIMIT_EXCEEDED:
                  summary: RATE_LIMIT_EXCEEDED
                  value:
                    error_code: RATE_LIMIT_EXCEEDED
