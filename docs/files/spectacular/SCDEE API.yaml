  /health/:
    get:
      operationId: health_check
      description: |-
        **Probe every infrastructure dependency and return an aggregated status.**

        Used by container orchestrators (Docker Compose health checks, Kubernetes readiness probes) and monitoring dashboards to decide whether the API should receive traffic.

        **Process**

        By default the endpoint only probes the components needed to serve a request: PostgreSQL and Redis. Both are inexpensive and respond in single-digit milliseconds when alive. This is what orchestrators should hit.

        Pass ``?deep=true`` to additionally probe MinIO (``head_bucket``) and Celery workers (broadcast ``ping``).

        **Output**

        * HTTP **200** with ``status: healthy`` if every component replied.
        * HTTP **503** with ``status: unhealthy`` if any component failed; the failing component's entry carries an ``error`` field.

        **Authentication**

        None required — this endpoint is intentionally public (RNF-5).
      summary: Health check (RNF-5)
      parameters:
      - in: query
        name: deep
        schema:
          type: boolean
        description: When ``true`` (or ``1``, case-insensitive), also probes MinIO
          and Celery. Default ``false``.
      tags:
      - System
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
              examples:
                HealthyFastExample:
                  value:
                    status: healthy
                    components:
                      postgresql:
                        status: healthy
                      redis:
                        status: healthy
                  summary: Default fast probe
                  description: 'PostgreSQL + Redis only. This is what orchestrators
                    should call. Typical latency: 5–20 ms when the service is alive.'
                HealthyExample:
                  value:
                    status: healthy
                    components:
                      postgresql:
                        status: healthy
                      redis:
                        status: healthy
                      minio:
                        status: healthy
                      celery_workers:
                        status: healthy
                        workers: 2
                  summary: All components healthy
                  description: Every infrastructure dependency replied successfully.
          description: All components healthy.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
              examples:
                DegradedExample:
                  value:
                    status: unhealthy
                    components:
                      postgresql:
                        status: healthy
                      redis:
                        status: healthy
                      minio:
                        status: healthy
                      celery_workers:
                        status: unhealthy
                        error: No workers responded
                  summary: At least one component is down
                  description: Returned with HTTP 503. The container orchestrator
                    should consider the API unhealthy and route traffic elsewhere.
          description: One or more components unhealthy.
        '429':
          description: Rate limit exceeded for this endpoint.
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                properties:
                  error_code:
                    type: string
                    enum:
                    - RATE_LIMIT_EXCEEDED
                    description: Symbolic, locale-independent error identifier. Map
                      to a localised message on the frontend.
              examples:
                RATE_LIMIT_EXCEEDED:
                  summary: RATE_LIMIT_EXCEEDED
                  value:
                    error_code: RATE_LIMIT_EXCEEDED
components:
  schemas:
    AnnotationResponse:
      type: object
      description: Output for annotation endpoints.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        instance_id:
          type: string
          format: uuid
          readOnly: true
        annotation_type:
          type: string
          readOnly: true
        storage_ref:
          type: string
          readOnly: true
        download_url:
          type: string
          nullable: true
          readOnly: true
        page_number:
          type: integer
          readOnly: true
        x:
          type: number
          format: double
          readOnly: true
        y:
          type: number
          format: double
          readOnly: true
        problem_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        author_id:
          type: string
          format: uuid
          readOnly: true
        author_email:
          type: string
          readOnly: true
        is_grade_annotation:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - annotation_type
      - author_email
      - author_id
      - created_at
      - download_url
      - id
      - instance_id
      - is_grade_annotation
      - page_number
      - problem_id
      - storage_ref
      - updated_at
      - x
      - y
    AnnotationTypeEnum:
      enum:
      - TEXT
      - STYLUS
      - AUDIO
      type: string
      description: |-
        * `TEXT` - Rich text
        * `STYLUS` - Stylus strokes (JSON)
        * `AUDIO` - Audio recording
    AssignMemberRequest:
      type: object
      description: Input for POST /api/v1/subjects/{id}/members/ (RF-4.6).
      properties:
        user_id:
          type: string
          format: uuid
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          description: |-
            TEACHER or STUDENT. COORDINATOR is set via subject creation/update.

            * `TEACHER` - TEACHER
            * `STUDENT` - STUDENT
        group_id:
          type: string
          format: uuid
          nullable: true
          description: Optional group assignment.
      required:
      - role
      - user_id
    AssignmentRuleRequest:
      type: object
      description: Input for POST /exams/{id}/assignment-rules/ (RF-8.1).
      properties:
        groups:
          type: array
          items:
            type: string
            format: uuid
        models_filter:
          type: array
          items:
            type: string
            format: uuid
        problems:
          type: array
          items:
            type: string
            format: uuid
        correctors:
          type: array
          items:
            type: string
            format: uuid
      required:
      - correctors
      - problems
    AssignmentRuleResponse:
      type: object
      description: Output for assignment rule endpoints.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        exam_id:
          type: string
          format: uuid
          readOnly: true
        groups:
          readOnly: true
        models_filter:
          readOnly: true
        problems:
          readOnly: true
        correctors:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - correctors
      - created_at
      - exam_id
      - groups
      - id
      - models_filter
      - problems
      - updated_at
    AttachPageRequest:
      type: object
      description: Input for POST /instances/{id}/pages/attach/ (RF-7.14).
      properties:
        page_id:
          type: string
          format: uuid
      required:
      - page_id
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        event_type:
          type: string
          readOnly: true
        actor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        actor_email:
          type: string
          nullable: true
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        entity_type:
          type: string
          readOnly: true
        entity_id:
          type: string
          readOnly: true
        payload:
          readOnly: true
      required:
      - actor
      - actor_email
      - entity_id
      - entity_type
      - event_type
      - id
      - ip_address
      - payload
      - timestamp
    BlankPDFUploadRequestRequest:
      type: object
      description: Input for PUT /models/{id}/blank-pdf/ (RF-6.7).
      properties:
        file:
          type: string
          format: binary
          description: PDF file (single document).
      required:
      - file
    BlankPDFUploadResponse:
      type: object
      description: Output for the blank-PDF upload endpoint (RF-6.7, RF-6.14).
      properties:
        blank_pdf_ref:
          type: string
          readOnly: true
        pages:
          type: integer
          readOnly: true
        page_dimensions:
          type: array
          items:
            $ref: '#/components/schemas/PageDimension'
          readOnly: true
        size_bytes:
          type: integer
          readOnly: true
      required:
      - blank_pdf_ref
      - page_dimensions
      - pages
      - size_bytes
    ComponentStatus:
      type: object
      description: |-
        One row of the ``components`` map in the health response.

        Inline-only — used for the response schema and the example.
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          description: |-
            Component-level status. ``healthy`` if reachable, ``unhealthy`` otherwise.

            * `healthy` - healthy
            * `unhealthy` - unhealthy
        error:
          type: string
          description: Error message when ``status`` is ``unhealthy``. Absent on healthy
            responses.
        workers:
          type: integer
          description: Number of Celery workers that responded. Only present for ``celery_workers``.
        note:
          type: string
          description: Optional non-fatal note (e.g. ``bucket_not_found`` when MinIO
            is reachable but no bucket exists yet).
      required:
      - status
    ConvocationResponse:
      type: object
      description: Output for convocation endpoint.
      properties:
        total:
          type: integer
          readOnly: true
        valid:
          type: integer
          readOnly: true
        invalid:
          type: array
          items: {}
          readOnly: true
      required:
      - invalid
      - total
      - valid
    ConvocationStudent:
      type: object
      description: Basic student info for convocation listing.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
      required:
      - email
      - first_name
      - id
      - last_name
    CorrectorTask:
      type: object
      properties:
        instance_id:
          type: string
          format: uuid
          readOnly: true
        exam_name:
          type: string
          readOnly: true
        student_email:
          type: string
          readOnly: true
          nullable: true
        ungraded_problems:
          type: array
          items:
            type: string
            format: uuid
          readOnly: true
        problems_sent:
          type: array
          items:
            type: string
            format: uuid
          readOnly: true
        total_problems:
          type: integer
          readOnly: true
      required:
      - exam_name
      - instance_id
      - problems_sent
      - student_email
      - total_problems
      - ungraded_problems
    Course:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          readOnly: true
        start_date:
          type: string
          format: date
          readOnly: true
        end_date:
          type: string
          format: date
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        subject_count:
          type: integer
          readOnly: true
          default: 0
          description: Number of subjects in this course (annotated).
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - end_date
      - id
      - is_active
      - label
      - start_date
      - subject_count
      - updated_at
    CoverageResponse:
      type: object
      description: Output for GET /exams/{id}/coverage/.
      properties:
        complete:
          type: boolean
          readOnly: true
        total_problems:
          type: integer
          readOnly: true
        covered_problems:
          type: integer
          readOnly: true
        uncovered_problems:
          type: array
          items:
            $ref: '#/components/schemas/UncoveredProblem'
          readOnly: true
        total_instances:
          type: integer
          readOnly: true
        rules_count:
          type: integer
          readOnly: true
      required:
      - complete
      - covered_problems
      - rules_count
      - total_instances
      - total_problems
      - uncovered_problems
    CreateAnnotationRequest:
      type: object
      description: Input for POST /instances/{id}/annotations/ (RF-10.1).
      properties:
        annotation_type:
          $ref: '#/components/schemas/AnnotationTypeEnum'
        payload:
          type: string
          default: ''
          description: 'Inline content: rich text or JSON strokes. Required for TEXT/STYLUS.'
        page_number:
          type: integer
          minimum: 1
          default: 1
        x:
          type: number
          format: double
          default: 0.0
        y:
          type: number
          format: double
          default: 0.0
        problem_id:
          type: string
          format: uuid
          nullable: true
          description: Optional problem association (RF-10.7).
        is_grade_annotation:
          type: boolean
          default: false
          description: If True, triggers OCR to extract a numeric grade (RF-10.5).
      required:
      - annotation_type
    CreateCourseRequest:
      type: object
      description: Input for POST /api/v1/courses/ (RF-3.1).
      properties:
        label:
          type: string
          minLength: 1
          description: Academic period label (e.g. "2025-2026").
          maxLength: 50
        start_date:
          type: string
          format: date
          nullable: true
          description: Informational start date.
        end_date:
          type: string
          format: date
          nullable: true
          description: Informational end date.
      required:
      - label
    CreateExamRequest:
      type: object
      description: Input for POST /subjects/{id}/exams/ (RF-6.1).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        date:
          type: string
          format: date-time
      required:
      - name
    CreateGroupRequest:
      type: object
      description: Input for POST /api/v1/subjects/{id}/groups/ (RF-4.5).
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 50
      required:
      - label
    CreateModelRequest:
      type: object
      description: Input for POST /exams/{id}/models/ (RF-6.5).
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 10
        copy_from_id:
          type: string
          format: uuid
          nullable: true
          description: Optional model ID to copy structure from.
      required:
      - label
    CreateOrganizationRequest:
      type: object
      description: |-
        Input for POST /api/v1/organizations/ (RF-2.1).

        Creates an organization and its initial manager in one request.
        Only accessible by superadmins.
      properties:
        name:
          type: string
          minLength: 1
          description: Organization display name (e.g. 'Universidad Autónoma de Madrid').
          maxLength: 255
        subdomain:
          type: string
          minLength: 1
          description: Unique identifier for URL routing (e.g. 'uam').
          maxLength: 63
          pattern: ^[-a-zA-Z0-9_]+$
        plan:
          allOf:
          - $ref: '#/components/schemas/PlanEnum'
          default: FREE
          description: |-
            Subscription plan (FREE or PREMIUM).

            * `FREE` - Free
            * `PREMIUM` - Premium
        initial_manager:
          allOf:
          - $ref: '#/components/schemas/InitialManagerRequest'
          description: Data for the organization's first manager.
      required:
      - initial_manager
      - name
      - subdomain
    CreatePageProfileRequest:
      type: object
      description: Input for POST /models/{id}/page-profiles/ (RF-6.8).
      properties:
        page_number:
          type: integer
          minimum: 1
      required:
      - page_number
    CreateProblemRequest:
      type: object
      description: Input for POST /models/{id}/problems/ (RF-6.9).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        max_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        order:
          type: integer
          default: 0
        zone_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Optional list of RecognitionZone IDs for answer regions.
      required:
      - max_score
      - name
    CreateReviewRequest:
      type: object
      description: Input for POST /exams/{id}/review/ (RF-12.1).
      properties:
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        notify_students:
          type: boolean
          default: false
      required:
      - end_date
      - start_date
    CreateSubjectRequest:
      type: object
      description: Input for POST /api/v1/subjects/ (RF-4.1).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        code:
          type: string
          minLength: 1
          maxLength: 50
        semester:
          type: string
          minLength: 1
          default: ''
          maxLength: 100
        coordinator_id:
          type: string
          format: uuid
          description: UUID of the user to assign as coordinator.
      required:
      - code
      - coordinator_id
      - name
    CreateUserRequest:
      type: object
      description: |-
        Input for POST /api/v1/users/ (RF-2.2).

        All fields are validated here. The view delegates to
        user_service.create_user() for business logic.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: User's email address (unique per organization).
        first_name:
          type: string
          minLength: 1
          description: User's given name.
          maxLength: 150
        last_name:
          type: string
          minLength: 1
          description: User's family name(s).
          maxLength: 150
        dni:
          type: string
          minLength: 1
          default: ''
          description: National ID document. Will be encrypted (AES-256-GCM).
          maxLength: 20
        nia:
          type: string
          minLength: 1
          default: ''
          description: Institutional identifier (unique per organization if provided).
          maxLength: 50
        is_staff:
          type: boolean
          default: false
          description: Whether the user is an organization manager.
      required:
      - email
      - first_name
      - last_name
    CreateZoneRequest:
      type: object
      description: Input for POST /page-profiles/{id}/zones/ (RF-6.8).
      properties:
        zone_type:
          $ref: '#/components/schemas/ZoneTypeEnum'
        attribute:
          type: string
          minLength: 1
          maxLength: 100
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        width:
          type: number
          format: double
          minimum: 0.1
        height:
          type: number
          format: double
          minimum: 0.1
        page_numbers:
          type: array
          items:
            type: integer
            minimum: 1
          description: Optional list of page numbers to create the same zone on. If
            provided, the URL's profile_pk is ignored (but must still be valid).
      required:
      - attribute
      - height
      - width
      - x
      - y
      - zone_type
    DetailResponse:
      type: object
      description: |-
        Generic ``{"detail": "..."}`` payload for endpoints that report
        a status string (e.g. PageReorderView, PageMoveView).
      properties:
        detail:
          type: string
          readOnly: true
      required:
      - detail
    EffectivePermissions:
      type: object
