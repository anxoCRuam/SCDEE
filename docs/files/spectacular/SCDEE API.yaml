    SubmitReviewRequestRequest:
      type: object
      description: Input for POST /instances/{id}/review-requests/ (RF-12.4).
      properties:
        problems:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: 'List of {"problem_id": "uuid", "message": "optional text"}.'
      required:
      - problems
    TargetStatusEnum:
      enum:
      - ASSEMBLING
      - RECEIVED
      - QUEUED
      - PENDING_GRADING
      - GRADED
      - PUBLISHED
      - IN_REVIEW
      - PENDING_REVIEW
      - FINALIZED
      - ARCHIVED
      type: string
      description: |-
        * `ASSEMBLING` - Assembling pages
        * `RECEIVED` - All pages received
        * `QUEUED` - Queued for recognition
        * `PENDING_GRADING` - Pending grading
        * `GRADED` - Graded
        * `PUBLISHED` - Published to student
        * `IN_REVIEW` - In review period
        * `PENDING_REVIEW` - Pending review resolution
        * `FINALIZED` - Finalized
        * `ARCHIVED` - Archived
    TokenPairResponse:
      type: object
      description: |-
        Output shape for login and refresh responses.

        Used by drf-spectacular to document the response schema.
        These fields are read-only and never used for input validation.
      properties:
        access_token:
          type: string
          readOnly: true
        refresh_token:
          type: string
          readOnly: true
        user:
          type: object
          additionalProperties: {}
          nullable: true
          description: |-
            Include basic user data in the login response.

            This saves the frontend an extra GET /profile/ request
            after login. Only included if user data is in the context.
          readOnly: true
      required:
      - access_token
      - refresh_token
      - user
    UncoveredProblem:
      type: object
      properties:
        problem_id:
          type: string
          format: uuid
          readOnly: true
        problem_name:
          type: string
          readOnly: true
        model:
          type: string
          readOnly: true
      required:
      - model
      - problem_id
      - problem_name
    UnreadCountResponse:
      type: object
      description: Output for the unread-count endpoint.
      properties:
        unread_count:
          type: integer
          readOnly: true
      required:
      - unread_count
    UpdateAnnotationRequest:
      type: object
      description: |-
        Input for PUT /annotations/{id}/ (RF-10.2).
        All fields are optional; only the ones present are modified.
      properties:
        payload:
          type: string
          description: New inline content (text or stylus JSON). If present and no
            file is uploaded, the text payload is used as the new content.
        page_number:
          type: integer
          minimum: 1
        x:
          type: number
          format: double
        y:
          type: number
          format: double
        problem_id:
          type: string
          format: uuid
          nullable: true
          description: Change problem association. None = remove.
    UpdateInstanceRequest:
      type: object
      description: Input for PATCH /instances/{id}/ (RF-7.2).
      properties:
        student_id:
          type: string
          format: uuid
        model_id:
          type: string
          format: uuid
    UserImportRequestRequest:
      type: object
      description: Multipart upload — CSV or JSON file with user rows (RF-2.3).
      properties:
        file:
          type: string
          format: binary
      required:
      - file
    UserImportResult:
      type: object
      description: |-
        Report shape returned by the bulk-import endpoint (matches
        ``ImportResult.to_dict``).
      properties:
        created:
          type: integer
          readOnly: true
        reactivated:
          type: integer
          readOnly: true
        updated:
          type: integer
          readOnly: true
        total_processed:
          type: integer
          readOnly: true
        total_errors:
          type: integer
          readOnly: true
        errors:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - created
      - errors
      - reactivated
      - total_errors
      - total_processed
      - updated
    UserResponse:
      type: object
      description: |-
        Output shape for user data in all responses.

        The DNI field is NEVER included here. When needed (own profile,
        export), the view adds it explicitly to the response data.
        This prevents accidental exposure.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        nia:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        is_staff:
          type: boolean
          readOnly: true
        organization_id:
          type: string
          format: uuid
          readOnly: true
        email_notifications_enabled:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - email_notifications_enabled
      - first_name
      - id
      - is_active
      - is_staff
      - last_name
      - nia
      - organization_id
      - updated_at
    ValidationErrorResponse:
      type: object
      description: |-
        Validation error response: one global code plus per-field codes.

        Emitted exclusively for HTTP 400. Each entry in ``errors`` is a
        list of symbolic codes (``FIELD_REQUIRED``, ``MIN_LENGTH``, ...)
        so the frontend can attach the right message to the right field.
      properties:
        error_code:
          allOf:
          - $ref: '#/components/schemas/ValidationErrorResponseErrorCodeEnum'
          description: |-
            Always equals ``VALIDATION_ERROR``.

            * `VALIDATION_ERROR` - VALIDATION_ERROR
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Map of field name → list of symbolic error codes. Nested fields
            are flattened with dot notation (e.g. ``user.email``). The pseudo-field
            ``non_field_errors`` carries cross-field errors.
      required:
      - error_code
      - errors
    ValidationErrorResponseErrorCodeEnum:
      enum:
      - VALIDATION_ERROR
      type: string
      description: '* `VALIDATION_ERROR` - VALIDATION_ERROR'
    ZoneResponse:
      type: object
      description: Output for zone endpoints.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        zone_type:
          type: string
          readOnly: true
        attribute:
          type: string
          readOnly: true
        x:
          type: number
          format: double
          readOnly: true
        y:
          type: number
          format: double
          readOnly: true
        width:
          type: number
          format: double
          readOnly: true
        height:
          type: number
          format: double
          readOnly: true
        page_profile_id:
          type: string
          format: uuid
          readOnly: true
      required:
      - attribute
      - height
      - id
      - page_profile_id
      - width
      - x
      - y
      - zone_type
    ZoneTypeEnum:
      enum:
      - OCR_TEXT
      - OCR_NUMBER
      - QR
      - CHECKBOX
      type: string
      description: |-
        * `OCR_TEXT` - OCR Text (free text)
        * `OCR_NUMBER` - OCR Number (numeric)
        * `QR` - QR Code
        * `CHECKBOX` - Checkbox (marked/unmarked)
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT access token. Obtain via `POST /api/v1/auth/login/`. Pass
        as `Authorization: Bearer <token>`. Access tokens expire after 15 minutes
        by default; use `POST /api/v1/auth/refresh/` to renew.'
servers:
- url: http://localhost:8000
  description: Local development
tags:
- name: Authentication
  description: JWT login, refresh and logout (RF-1.2 / RF-1.3 / RF-1.4). All three
    endpoints are public — no Authorization header required.
- name: Users
  description: User management (RF-2.x).
- name: Organizations
  description: Tenant-level resources, accessible only to the superadmin (RF-2.1)
    and to managers for their own organisation.
- name: Courses
  description: Academic courses and the lifecycle around them (RF-3.x).
- name: Subjects
  description: Academic subjects, groups, and per-subject memberships (RF-4.x).
- name: Exams
  description: Exams, models, page profiles, problems and rubrics (RF-6.x).
- name: Instances
  description: 'Per-student exam instances: pages, state machine, publish (RF-7.x).'
- name: Grading
  description: Corrector assignment rules and coverage && Manual and rubric-based
    grading with optimistic concurrency (RF-8.x, RF-11.x).
- name: Annotations
  description: Text, stylus and audio annotations on exam instances (RF-10.x).
- name: Ingestion
  description: Manual ingestion entry-point and OCR engine catalogue (RF-9.x).
- name: Reviews
  description: Student review requests after grade publication (RF-12.x).
- name: Notifications
  description: In-app notifications and per-user preferences (RF-13.x).
- name: Audit
  description: Read-only access to the immutable audit log (RF-16.1, RF-16.2).
- name: System
  description: Infrastructure endpoints. Public.
