                      rubric_selections:
                      - rc1-uuid
                    can_download: false
                  summary: Student view – after review window closed, can_view_pages_after_review=True
                  description: Returned when the review window has status `CLOSED`
                    or `COMPLETED` but the exam has `can_view_pages_after_review`
                    enabled. The data is identical to the detailed view, but the student
                    can no longer submit review requests.
          description: See the individual example descriptions for details.
