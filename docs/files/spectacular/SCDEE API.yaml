  /api/v1/instances/{instance_pk}/transition/:
    patch:
      operationId: instances_transition
      description: |-
        **Advance (or roll back) the lifecycle state of one instance.**

        Allowed transitions are encoded in the service layer (``InstanceStatus`` machine). Common forward edges:
        - ``ASSEMBLING → RECEIVED`` once every expected page has arrived.
        - ``RECEIVED → PENDING_GRADING`` after recognition completes.
        - **``PENDING_GRADING → GRADED`` once every problem has a score.**
        - ``GRADED → PUBLISHED`` (usually via the bulk-publish endpoint).

        Reverse transitions (RF-7.12) are also supported by the service for error recovery; the view delegates to the same code path and lets the service decide validity.

        **Output**

        The updated instance with its new ``status`` and a fresh ``page_count``. An audit row ``INSTANCE_TRANSITION`` is added with the target status in the payload (RF-16.1).

        The above applies if you have 'can_view_all_instances'. Otherwise, for a teacher who has the instance to grade, you can transition from PENDING_GRADING to GRADED and vice versa.
      summary: Move an instance through its state machine (RF-7.5)
      parameters:
      - in: path
        name: instance_pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Instances
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTransitionRequest'
            examples:
              TransitionRequest:
                value:
                  target_status: GRADED
                summary: Move PENDING_GRADING → GRADED
                description: 'Allowed transitions are checked server-side. Invalid
                  transitions return HTTP 409 with ``error_code: CONFLICT`` and the
                  offending target in the audit log.'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTransitionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTransitionRequest'
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResponse'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse409_CONFLICT'
              examples:
                CONFLICT:
                  value:
                    error_code: CONFLICT
                  summary: CONFLICT
          description: The requested transition is not allowed from the instance's
            current state. The body carries the offending ``error_code``; the audit
            log records the attempted target.
        '401':
          description: Authentication credentials missing, expired or revoked.
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                properties:
                  error_code:
                    type: string
                    enum:
                    - AUTHENTICATION_REQUIRED
                    description: Symbolic, locale-independent error identifier. Map
                      to a localised message on the frontend.
              examples:
                AUTHENTICATION_REQUIRED:
                  summary: AUTHENTICATION_REQUIRED
                  value:
                    error_code: AUTHENTICATION_REQUIRED
        '403':
          description: Authenticated, but not authorised for this resource.
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                properties:
                  error_code:
                    type: string
                    enum:
                    - PERMISSION_DENIED
                    description: Symbolic, locale-independent error identifier. Map
                      to a localised message on the frontend.
              examples:
                PERMISSION_DENIED:
                  summary: PERMISSION_DENIED
                  value:
                    error_code: PERMISSION_DENIED
        '404':
          description: Resource not found in the caller's organisation.
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                properties:
                  error_code:
                    type: string
                    enum:
                    - NOT_FOUND
                    description: Symbolic, locale-independent error identifier. Map
