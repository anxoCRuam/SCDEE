  /api/v1/exams/{exam_pk}/publish/:
    post:
      operationId: exams_publish_grades
      description: |-
        **Move every ``GRADED`` instance of the exam to ``PUBLISHED`` and (optionally) notify the affected students.**

        **Process**

        1. Iterate over every instance of the exam.
        2. Skip those still in ``PENDING_GRADING`` and those with ``has_issues=True`` — the response reports the count and reason in ``skipped_reasons`` so the coordinator knows what's left to do.
        3. Transition the remaining instances to ``PUBLISHED`` atomically (one transaction per instance).
        4. Enqueue ``GRADES_PUBLISHED`` notifications (in-app + email mirror) for the students whose instance was published, subject to their ``email_notifications_enabled`` preference (RF-2.11, RF-13.1).
        5. Append a ``GRADES_PUBLISHED`` audit row with the totals.

        **Idempotency**

        Already-``PUBLISHED`` instances are counted under ``skipped`` (reason ``ALREADY_PUBLISHED``) and not re-notified. Calling the endpoint twice is therefore safe.

        **Output**

        An aggregate report with the totals and the reason breakdown for the skips.
      summary: Bulk-publish all graded instances of an exam (RF-7.9) 'can_publish_grades'
        required
      parameters:
      - in: path
        name: exam_pk
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Instances
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResult'
              examples:
                PublishResult:
                  value:
                    published: 287
                    skipped: 13
                    skipped_reasons:
                      HAS_ISSUES: 9
                      NOT_GRADED: 4
                  summary: Aggregated publish report
                  description: Returned even when nothing was published — the counts
                    let the caller distinguish between ‘nothing to do’ and ‘some skipped
                    due to issues’.
          description: ''
        '401':
          description: Authentication credentials missing, expired or revoked.
          content:
            application/json:
              schema:
                type: object
                required:
                - error_code
                properties:
                  error_code:
