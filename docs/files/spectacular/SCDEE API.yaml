        Input for POST /auth/login/.

        Validates that email and password are present and non-empty.
        Does NOT verify credentials — that's the plugin's job.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          description: User's email address (login identifier).
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: User's password. Sent only in the request, never in responses.
      required:
      - email
      - password
    LogoutRequestRequest:
      type: object
      description: |-
        Input for POST /auth/logout/.

        The client sends the refresh token to invalidate.
        The access token will expire naturally (short-lived).
      properties:
        refresh_token:
          type: string
          minLength: 1
          description: Refresh token to revoke.
      required:
      - refresh_token
