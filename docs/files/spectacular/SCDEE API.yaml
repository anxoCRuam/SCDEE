  /api/v1/instances/{instance_pk}/download/:
    get:
      operationId: api_v1_instances_download_retrieve
      description: |-
        **Serve the instance's composed PDF, with optional dynamic watermark and encryption.**

        Who can call this endpoint:
        - **Staff / superadmins** → always.
        - **Teachers / coordinators** → if they have `can_view_all_instances` or are assigned to this instance via an `AssignmentRule`.
        - **Students** → only for their own instance, and only if the exam's `student_permissions.can_view_pages` is `True` **and** a review window allows access (either `OPEN` with instance `IN_REVIEW`, or `CLOSED`/`COMPLETED` with `can_view_pages_after_review`).

        What the response contains:
        - **For staff/teachers** → plain `application/pdf`, `Content-Disposition: attachment`.
        - **For students with `can_download_pages=True`** → plain `application/pdf`, `Content-Disposition: inline` (view in browser).
        - **For students without `can_download_pages`** → encrypted `application/octet-stream`, `Content-Disposition: inline`. The PDF is encrypted with AES-256-GCM using a key derived from the user's ID, and must be decrypted client-side. Anti-cache headers are set.

        Every student download includes a dynamic watermark (name, NIA, date).
      summary: Download composed instance PDF (RF-7.15) – with watermark and anti-download
