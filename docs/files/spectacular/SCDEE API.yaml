          type: string
          description: New DNI value. Will be re-encrypted.
          maxLength: 20
        is_staff:
          type: boolean
          description: Promote/demote to organization manager (RF-2.6).
        is_active:
          type: boolean
          description: Set to false to deactivate (soft delete, RF-2.5).
