[project]
name = "scdee-backend"
version = "1.0.0"
description = "Backend for the Digital Exam Correction System (SCDEE)"
requires-python = ">=3.12"

# ============================================================
# Ruff — linter + formatter (replaces flake8, isort, black)
# ============================================================
[tool.ruff]
target-version = "py312"
line-length = 99
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "T20",  # flake8-print (catches stray print statements)
    "DTZ",  # flake8-datetimez (enforce timezone-aware datetimes)
    "DJ",   # flake8-django
    "S",    # flake8-bandit (security)
    "C4",   # flake8-comprehensions
    "RET",  # flake8-return
]
ignore = [
    "S101",  # Allow assert in tests
    "B008",  # Allow function calls in default arguments (DRF uses this)
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "scdee"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101"]           # Allow assert in tests
"**/migrations/**/*.py" = ["E501"]      # Allow long lines in migrations
"scdee/settings/*.py" = ["F405", "F403"]  # Import issues en settings
# ============================================================
# mypy — static type checker
# ============================================================
[tool.mypy]
python_version = "3.12"
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main",
]
# Strict but pragmatic: errors on untyped defs, but allows
# gradual adoption via per-module overrides.
disallow_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[tool.django-stubs]
django_settings_module = "scdee.settings.dev"

# ============================================================
# pytest — test runner
# ============================================================
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "scdee.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]
